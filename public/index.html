<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Delass 3D Gallery</title>
<meta name="description" content="A showcase of 3D prints from the Delass 3D Gallery." />
<link rel="canonical" href="https://art.delass.ee/" />
<meta name="theme-color" content="#0a0a0b" />

<!-- Link previews. og:image must be an absolute URL — most crawlers
     will not resolve a relative one. -->
<meta property="og:site_name" content="Delass 3D Gallery" />
<meta property="og:title" content="Delass 3D Gallery" />
<meta property="og:description" content="A showcase of 3D prints from the Delass 3D Gallery." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://art.delass.ee/" />
<meta property="og:image" content="https://art.delass.ee/images/01-stas-v2.jpg" />
<meta property="og:image:alt" content="A black 3D-printed relief plaque resting on dark fabric with gold embroidery." />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Delass 3D Gallery" />
<meta name="twitter:description" content="A showcase of 3D prints from the Delass 3D Gallery." />
<meta name="twitter:image" content="https://art.delass.ee/images/01-stas-v2.jpg" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#129513;</text></svg>" />

<!-- Saved to an iOS home screen this gets a proper icon instead of a
     screenshot. Deliberately no manifest and no service worker: the site
     opens in the browser, which is what we want, and there is no offline
     cache to serve a stale gallery. -->
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
</head>
<body data-view="gallery">
<a class="skip" href="#gallery">Skip to the gallery</a>

<!-- ===== gallery view ===== -->
<div id="galleryView">
  <header class="masthead">
    <div class="wrap">
      <p class="kicker">Delass</p>
      <h1>3D&nbsp;Gallery</h1>
      <p class="lede">
        Things that came off the plate. Every piece here is finished and
        photographed as it is &mdash; layer lines, stringing and all.
      </p>
    </div>
  </header>

  <main id="gallery" class="wrap">
    <p class="index-label"><span id="count"></span></p>
    <ul class="grid" id="grid"></ul>

    <aside class="cta-band">
      <p class="cta-note">Commissions, questions, complaints</p>
      <a class="cta" data-contact href="#" target="_blank" rel="noopener noreferrer">
        Get in touch <span class="cta-arrow" aria-hidden="true">&#8594;</span>
      </a>
    </aside>
  </main>
</div>

<!-- ===== single piece view ===== -->
<article id="pieceView" class="piece" hidden>
  <div class="wrap">
    <nav class="piece-nav">
      <button type="button" class="back" id="backBtn">
        <span class="back-arrow" aria-hidden="true">&#8592;</span> Gallery
      </button>
    </nav>

    <div class="piece-body">
      <figure class="piece-figure">
        <img id="pieceImg" alt="" />
      </figure>

      <div class="piece-text">
        <p class="piece-num" id="pieceNum"></p>
        <h1 class="piece-title" id="pieceTitle" tabindex="-1"></h1>
        <p class="piece-translit" id="pieceTranslit"></p>
        <p class="piece-blurb" id="pieceBlurb"></p>
        <dl class="specs" id="pieceSpecs"></dl>

        <a class="cta cta-piece" data-contact href="#" target="_blank" rel="noopener noreferrer">
          Ask about this piece <span class="cta-arrow" aria-hidden="true">&#8594;</span>
        </a>
      </div>
    </div>

    <nav class="piece-steps" id="pieceSteps" hidden>
      <button type="button" class="step" id="prevBtn">
        <span aria-hidden="true">&#8592;</span> Previous piece
      </button>
      <button type="button" class="step" id="nextBtn">
        Next piece <span aria-hidden="true">&#8594;</span>
      </button>
    </nav>
  </div>
</article>

<footer class="wrap foot">
  <p>&copy; <span id="year"></span> Delass 3D Gallery</p>
</footer>

<script src="/pieces.js"></script>
<script src="/main.js"></script>
</body>
</html>
